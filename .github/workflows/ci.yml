name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: switchyard
          POSTGRES_PASSWORD: switchyard
          POSTGRES_DB: switchyard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U switchyard"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://switchyard:switchyard@localhost:5432/switchyard
      REDIS_URL: redis://localhost:6379/0
      USE_REAL_REDIS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  end-to-end:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: docker compose up --build -d
      - run: pip install httpx==0.28.1
      - run: python scripts/smoke_test.py
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=100
